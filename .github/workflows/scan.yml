name: Weekly link scan

on:
  schedule:
    # Mondays 06:00 UTC = 09:00 Helsinki (EEST). Adjust as needed.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Allows manual triggering from the Actions tab

permissions:
  contents: write   # commit results back to the repo
  issues: write     # create/update issues with broken-links report

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linkmap scan
        run: |
          python linkmap.py https://www.kolmekampusta.fi/fi \
            --max-pages 2000 \
            --delay 0.3 \
            --skip-pattern '^https?://(www\.)?kolmekampusta\.fi/sv([/?#]|$)' \
            --skip-pattern '/user/' \
            --skip-pattern '/admin/' \
            --skip-pattern '/node/\d+/(edit|delete)' \
            --skip-pattern '\?destination=' \
            --skip-pattern '/feed(/|$|\?)' \
            --no-canonical-report \
            --external-verify-timeout 25 \
            --external-verify-retries 2 \
            --trust-domain keyframe.fi \
            --trust-domain stresspass.app \
            --trust-domain bikeland.fi \
            --trust-domain urn.fi \
            --trust-domain oppisopimus.net \
            --trust-domain urheilijanurapolku.fi \
            --trust-domain oikeus.fi \
            --trust-domain emmi.fi \
            --trust-domain leimausleiri.fi \
            --output 3k-fi
        # CACHE-BUSTING is ON by default (no flag needed): every internal request
        #     gets no-cache headers + a unique _cb query param so a CDN / reverse
        #     proxy in front of Drupal can't serve a stale cached render. This is
        #     why a link removed from a page days ago will no longer show up. If a
        #     scan ever needs the raw cached behavior, add --no-cache-bust.
        #     NB: if stale pages STILL appear, the cache layer is ignoring the
        #     query string in its cache key — that needs a server-side fix (purge
        #     on publish, or include query string in the CDN cache key).
        #
        # --no-canonical-report  : keeps the dedup CRAWL behavior (so the crawl
        #     stays bounded and filter-URL permutations are NOT followed), but
        #     omits the canonical-duplicates section + stats from the report.
        #     To turn the feature fully off (follow duplicate URLs too), swap this
        #     for --no-canonical-dedup — but note that can eat the page budget.
        #
        # --external-verify-*    : failed external links are re-checked with GET
        #     and a 25s timeout + 2 retries. This clears genuine slow-site false
        #     positives. Sites that hard-block datacenter IPs (instant 403/415)
        #     fail fast and don't waste the budget.
        #
        # --trust-domain         : these partner domains hard-block GitHub Actions
        #     IPs (Cloudflare / WAF) and can't be verified from CI, but are known
        #     good. Their bot-block failures (403/415/timeout) are treated as OK.
        #     A genuine 404/DNS failure on these domains is STILL reported.
        #     Add/remove domains here as your outbound links change.

      - name: Read scan stats
        id: stats
        run: |
          BROKEN=$(python -c "import json; print(json.load(open('3k-fi.json'))['stats']['broken_count'])")
          PAGES=$(python -c "import json; print(json.load(open('3k-fi.json'))['stats']['pages_crawled'])")
          NO_ALIAS=$(python -c "import json; print(json.load(open('3k-fi.json'))['stats'].get('no_alias_count', 0))")
          UNCERTAIN=$(python -c "import json; print(json.load(open('3k-fi.json'))['stats'].get('external_uncertain_count', 0))")
          TRUSTED=$(python -c "import json; print(json.load(open('3k-fi.json'))['stats'].get('external_trusted_ok_count', 0))")
          DATE=$(date -I)
          echo "broken=$BROKEN" >> $GITHUB_OUTPUT
          echo "pages=$PAGES" >> $GITHUB_OUTPUT
          echo "no_alias=$NO_ALIAS" >> $GITHUB_OUTPUT
          echo "uncertain=$UNCERTAIN" >> $GITHUB_OUTPUT
          echo "trusted=$TRUSTED" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "Scan: $PAGES pages, $BROKEN broken (definite), $UNCERTAIN uncertain, $TRUSTED trusted-OK, $NO_ALIAS no-alias"

      - name: Commit results
        run: |
          git config user.email "actions@github.com"
          git config user.name "linkmap-bot"
          git add 3k-fi* index.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly scan ${{ steps.stats.outputs.date }} — ${{ steps.stats.outputs.pages }} pages, ${{ steps.stats.outputs.broken }} broken, ${{ steps.stats.outputs.uncertain }} uncertain"
            git push
          fi

      # GitHub issue is opened ONLY for definite-broken links (404, 410, DNS
      # failures, connection refused). Uncertain external links (WAF/bot-blocked
      # 403/415/timeout) and trusted-domain links do NOT count toward the broken
      # total and never trigger this step. Uncertain links still appear in the
      # markdown report's "❓ External links — could not be verified" section.
      - name: Open or update issue if broken links found
        if: steps.stats.outputs.broken != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          gh label create broken-links --color FF0000 --description "Auto-created by linkmap workflow" 2>/dev/null || true
          REPORT=3k-fi-broken.md

          BODY_FILE=$(mktemp)
          if [ "$(wc -c < "$REPORT")" -gt 60000 ]; then
            head -c 60000 "$REPORT" > "$BODY_FILE"
            echo "" >> "$BODY_FILE"
            echo "..." >> "$BODY_FILE"
            echo "*(truncated; see [$REPORT](../tree/main/$REPORT) for full report)*" >> "$BODY_FILE"
          else
            cp "$REPORT" "$BODY_FILE"
          fi

          echo "" >> "$BODY_FILE"
          echo "---" >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          echo "🌐 [Interactive map](https://${OWNER}.github.io/${REPO_NAME}/3k-fi.html) · " >> "$BODY_FILE"
          echo "📄 [Full report](../tree/main/$REPORT) · " >> "$BODY_FILE"
          echo "🔄 [Run scan now](../actions/workflows/scan.yml)" >> "$BODY_FILE"

          EXISTING=$(gh issue list --label broken-links --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          TITLE="🔴 ${{ steps.stats.outputs.broken }} broken link(s) — ${{ steps.stats.outputs.date }}"

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file "$BODY_FILE" --title "$TITLE"
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE" --label broken-links
            echo "Created new issue"
          fi

      - name: Close issue if no broken links
        if: steps.stats.outputs.broken == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for num in $(gh issue list --label broken-links --state open --json number --jq '.[].number' 2>/dev/null); do
            gh issue close "$num" --comment "✅ Latest scan ${{ steps.stats.outputs.date }} found 0 definite broken links. Auto-closing this issue."
          done
