name: Weekly link scan

on:
  schedule:
    # Mondays 06:00 UTC = 09:00 Helsinki (EEST). Adjust as needed.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Allows manual triggering from the Actions tab

# Pages source is set to "GitHub Actions" (Settings -> Pages -> Source), so the
# site is published by the deploy job below — NOT by pushing to a branch. A
# plain git push does not update Pages in this mode; only actions/deploy-pages
# does. That is why earlier scans committed fresh data but the site stayed stale.
permissions:
  contents: write   # commit results back to the repo (history / raw JSON URL)
  issues: write     # create/update issues with broken-links report
  pages: write      # publish to GitHub Pages
  id-token: write   # required by actions/deploy-pages (OIDC)

# Only one Pages deployment at a time; don't cancel an in-progress scan.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the commit step can rebase before pushing

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linkmap scan
        run: |
          python linkmap.py https://www.kolmekampusta.fi/fi \
            --max-pages 2000 \
            --delay 0.3 \
            --skip-pattern '^https?://(www\.)?kolmekampusta\.fi/sv([/?#]|$)' \
            --skip-pattern '/user/' \
            --skip-pattern '/admin/' \
            --skip-pattern '/node/\d+/(edit|delete)' \
            --skip-pattern '\?destination=' \
            --skip-pattern '/feed(/|$|\?)' \
            --no-canonical-report \
            --external-verify-timeout 25 \
            --external-verify-retries 2 \
            --trust-domain keyframe.fi \
            --trust-domain stresspass.app \
            --trust-domain bikeland.fi \
            --trust-domain urn.fi \
            --trust-domain oppisopimus.net \
            --trust-domain urheilijanurapolku.fi \
            --trust-domain oikeus.fi \
            --trust-domain emmi.fi \
            --trust-domain leimausleiri.fi \
            --output 3k-fi
        # CACHE-BUSTING is ON by default: every internal request gets no-cache
        #   headers + a unique _cb query param so a CDN/proxy in front of Drupal
        #   can't serve a stale cached render. Add --no-cache-bust to disable.
        # --no-canonical-report keeps the dedup crawl behavior but omits the
        #   canonical-duplicates section. --external-verify-* re-checks failed
        #   external links with a generous timeout. --trust-domain treats known
        #   WAF-blocked partner domains as OK (a real 404 there is still reported).

      - name: Read scan stats
        id: stats
        run: |
          BROKEN=$(python -c "import json; print(json.load(open('3k-fi.json'))['stats']['broken_count'])")
          PAGES=$(python -c "import json; print(json.load(open('3k-fi.json'))['stats']['pages_crawled'])")
          NO_ALIAS=$(python -c "import json; print(json.load(open('3k-fi.json'))['stats'].get('no_alias_count', 0))")
          UNCERTAIN=$(python -c "import json; print(json.load(open('3k-fi.json'))['stats'].get('external_uncertain_count', 0))")
          TRUSTED=$(python -c "import json; print(json.load(open('3k-fi.json'))['stats'].get('external_trusted_ok_count', 0))")
          DATE=$(date -I)
          echo "broken=$BROKEN" >> $GITHUB_OUTPUT
          echo "pages=$PAGES" >> $GITHUB_OUTPUT
          echo "no_alias=$NO_ALIAS" >> $GITHUB_OUTPUT
          echo "uncertain=$UNCERTAIN" >> $GITHUB_OUTPUT
          echo "trusted=$TRUSTED" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "Scan: $PAGES pages, $BROKEN broken (definite), $UNCERTAIN uncertain, $TRUSTED trusted-OK, $NO_ALIAS no-alias"

      # Commit results back to the repo for git history + the raw 3k-fi.json URL.
      # This is now OPTIONAL (Pages is fed by the artifact below, not the branch),
      # so it's best-effort: a push hiccup must not block the Pages deploy.
      - name: Commit results (history)
        continue-on-error: true
        run: |
          git config user.email "actions@github.com"
          git config user.name "linkmap-bot"
          git add 3k-fi* index.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly scan ${{ steps.stats.outputs.date }} — ${{ steps.stats.outputs.pages }} pages, ${{ steps.stats.outputs.broken }} broken, ${{ steps.stats.outputs.uncertain }} uncertain"
            # The scan takes ~15 min, during which remote main may have moved
            # (e.g. a manual edit to scan.yml). Rebase onto the latest main and
            # retry so a non-fast-forward rejection doesn't fail the run.
            pushed=false
            for attempt in 1 2 3; do
              if git push; then pushed=true; break; fi
              echo "Push rejected (attempt $attempt) — rebasing onto latest main and retrying…"
              git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; }
            done
            if [ "$pushed" != "true" ]; then
              echo "Could not push results after 3 attempts. History not updated — Pages still deploys below."
            fi
          fi

      # ---- Publish to GitHub Pages (the part that was missing) ----
      - name: Prepare Pages site directory
        run: |
          mkdir -p _site
          # Landing/dispatcher page (committed in the repo). Soft-guarded.
          cp index.html _site/ 2>/dev/null || echo "WARN: no index.html dispatcher found"
          # Fresh scan outputs (must exist — the scan step produced them).
          cp 3k-fi.json 3k-fi.html 3k-fi-broken.md _site/
          echo "Files staged for Pages:"
          ls -la _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub issue opens ONLY for definite-broken links (404/410/DNS/refused).
      # Uncertain (WAF/bot-blocked) and trusted-domain links never trigger it.
      # Best-effort so a gh hiccup can't fail the job and block the deploy.
      - name: Open or update issue if broken links found
        if: steps.stats.outputs.broken != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          gh label create broken-links --color FF0000 --description "Auto-created by linkmap workflow" 2>/dev/null || true
          REPORT=3k-fi-broken.md
          BODY_FILE=$(mktemp)
          if [ "$(wc -c < "$REPORT")" -gt 60000 ]; then
            head -c 60000 "$REPORT" > "$BODY_FILE"
            echo "" >> "$BODY_FILE"; echo "..." >> "$BODY_FILE"
            echo "*(truncated; see [$REPORT](../tree/main/$REPORT) for full report)*" >> "$BODY_FILE"
          else
            cp "$REPORT" "$BODY_FILE"
          fi
          echo "" >> "$BODY_FILE"; echo "---" >> "$BODY_FILE"; echo "" >> "$BODY_FILE"
          echo "🌐 [Interactive map](https://${OWNER}.github.io/${REPO_NAME}/3k-fi.html) · " >> "$BODY_FILE"
          echo "📄 [Full report](../tree/main/$REPORT) · " >> "$BODY_FILE"
          echo "🔄 [Run scan now](../actions/workflows/scan.yml)" >> "$BODY_FILE"
          EXISTING=$(gh issue list --label broken-links --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          TITLE="🔴 ${{ steps.stats.outputs.broken }} broken link(s) — ${{ steps.stats.outputs.date }}"
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file "$BODY_FILE" --title "$TITLE"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE" --label broken-links
          fi

      - name: Close issue if no broken links
        if: steps.stats.outputs.broken == '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for num in $(gh issue list --label broken-links --state open --json number --jq '.[].number' 2>/dev/null); do
            gh issue close "$num" --comment "✅ Latest scan ${{ steps.stats.outputs.date }} found 0 definite broken links. Auto-closing this issue."
          done

  # Separate deploy job: publishes the artifact uploaded above to GitHub Pages.
  # Required when Pages source = "GitHub Actions". Runs only if the scan job
  # succeeded (the artifact exists).
  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
